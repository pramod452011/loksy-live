<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- LOKSY Signature Vibrant Indian Social Gradient -->
    <linearGradient id="loksyMainGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4668" />
      <stop offset="35%" stop-color="#FF8A00" />
      <stop offset="70%" stop-color="#E040FB" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="loksyRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4668" />
      <stop offset="50%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="pinkGlow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FF4668" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF4668" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="loksyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#FF4668" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Squircle / Base Canvas -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="124"
    ry="124"
    fill="#070A12"
    stroke="url(#loksyRimGrad)"
    stroke-width="7"
    filter="url(#loksyShadow)"
  />

  <!-- Subtle Radial Glow Overlays -->
  <rect x="20" y="20" width="472" height="472" rx="120" ry="120" fill="url(#pinkGlow)" pointer-events="none" />
  <rect x="20" y="20" width="472" height="472" rx="120" ry="120" fill="url(#cyanGlow)" pointer-events="none" />

  <!-- Outer Camera / Social Emblem Body -->
  <rect
    x="126"
    y="126"
    width="260"
    height="260"
    rx="78"
    ry="78"
    fill="none"
    stroke="url(#loksyMainGrad)"
    stroke-width="26"
    stroke-linecap="round"
  />

  <!-- Center Circular Aperture Lens -->
  <circle
    cx="256"
    cy="256"
    r="64"
    fill="none"
    stroke="url(#loksyMainGrad)"
    stroke-width="22"
  />

  <!-- Golden Saffron Flash Sensor Bead -->
  <circle cx="330" cy="182" r="16" fill="#FFB703" />
  <circle cx="330" cy="182" r="6" fill="#FFFFFF" opacity="0.9" />

  <!-- Radiant Center Four-Point Sparkle -->
  <path
    d="M256 226 C256 242 242 256 226 256 C242 256 256 270 256 286 C256 270 270 256 286 256 C270 256 256 242 256 226 Z"
    fill="#FFFFFF"
  />
</svg>
